<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quel champion es-tu ?</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d1c;--panel:#0f1b36;--line:#2b3b5e;--gold:#c8aa6e;--hex:#0ac8b9;--txt:#f0e6d2;--mute:#9aa4b8;--c:#c8aa6e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--txt);font:17px/1.55 'Source Sans 3',system-ui,sans-serif;
background:radial-gradient(ellipse at 50% -10%,#16315f 0,transparent 55%),radial-gradient(circle at 90% 100%,#0a3a46 0,transparent 40%),var(--bg);display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:32px 20px 48px}
h1,h2,.q{font-family:Cinzel,Georgia,serif}
h1{font-size:2.5rem;line-height:1.1;margin:28px 0 14px;color:var(--gold);font-weight:800}
.lead{color:var(--mute);margin:0 0 8px}
.emb{width:84px;height:96px;margin:0 auto;display:grid;place-items:center;background:linear-gradient(160deg,var(--hex),#0a3a46);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font:800 2.4rem Cinzel,serif;color:#04121f}
.btn{display:block;width:100%;text-align:left;background:linear-gradient(180deg,#13234a,var(--panel));color:var(--txt);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:3px;padding:14px 16px;margin:0 0 10px;font:inherit;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.btn:hover,.btn:focus-visible{border-color:var(--gold);transform:translateX(4px);outline:none}
.btn.pick{border-color:var(--hex);background:#0a3a46}
.go{background:var(--gold);color:#07101f;border-color:var(--gold);text-align:center;font:800 1.05rem Cinzel,serif;margin-top:22px;padding:16px}
.go:hover,.go:focus-visible{transform:none;background:#e6cd90;border-color:#e6cd90}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin-bottom:8px}
.bar{height:5px;background:#1b2a4a;margin-bottom:26px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hex),var(--gold));width:0;transition:width .35s}
.tag{display:inline-block;color:var(--hex);font-size:.95rem;margin-bottom:8px}
.q{font-size:1.4rem;line-height:1.3;margin:0 0 22px;font-weight:600}
.joke{margin:0 auto 18px;max-width:42ch;padding:12px 16px;border-left:3px solid var(--c);background:var(--panel);font-style:italic;text-align:left;border-radius:0 3px 3px 0}
.res{text-align:center}
.pic{position:relative;width:200px;height:200px;margin:8px auto 18px;display:grid;place-items:center;background:var(--c);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font:800 5rem Cinzel,serif;color:#07101f;animation:pop .5s ease-out}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.res h2{font-size:2.6rem;margin:0;color:var(--c);font-weight:800}
.title{color:var(--mute);margin:0 0 14px}
.res p.d{margin:0 auto 22px;max-width:46ch}
.aff{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 16px}
.row{display:grid;grid-template-columns:76px 1fr 40px;gap:10px;align-items:center;margin:7px 0;font-size:.95rem}
.row b{height:8px;background:#1b2a4a;border-radius:4px;overflow:hidden}
.row b i{display:block;height:100%;background:var(--c2);border-radius:4px}
.row span:last-child{text-align:right;color:var(--mute)}
[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
<section id="intro" class="res">
<div class="emb">⚔</div>
<h1>Quel champion es-tu ?</h1>
<p class="lead">8 questions, un seul verdict. Runeterra sait déjà qui tu es, il faut juste le prouver.</p>
<button class="btn go" id="start">Entrer sur la Faille</button>
</section>
<section id="quiz" hidden>
<div class="top"><span id="cnt"></span><span id="reg"></span></div>
<div class="bar"><i id="prog"></i></div>
<p class="q" id="q"></p>
<div id="a"></div>
</section>
<section id="result" class="res" hidden>
<div class="pic" id="pic"></div>
<h2 id="rn"></h2>
<p class="title" id="rt"></p>
<blockquote class="joke" id="rj"></blockquote>
<p class="d" id="rd"></p>
<div class="aff" id="aff"></div>
<button class="btn go" id="again">Rejouer</button>
</section>
</main>
<script>
/* IMAGES : colle ici l'URL ou le chemin de l'image de chaque champion (ex: "img/hecarim.jpg"). Vide = emblème avec l'initiale. */
const IMG={hecarim:"hecarim.webp",shaco:"shaco.webp",sett:"sett.webp",samira:"samira.webp",kaisa:"kaisa.webp",kayn:"kayn.webp"};
/* PRIVATE JOKES : remplace chaque citation par votre vraie private joke. */
const JOKES={hecarim:"« Petit Tonner »",shaco:"« c'est le plus fun shaco ap »",sett:"« joue grasp c'est broken »",samira:"« 1v1 samira contre Math à la gare du nord »",kaisa:"« kai'sa jungle tkt »",kayn:"« c'est vraiment des molgons »"};
const C={
hecarim:{n:"Hécarim",t:"Le Spectre de la guerre",c:"#3fe0cf",d:"Tu arrives avant tout le monde, dans un grondement de sabots. Pour toi, l'hésitation est une faiblesse : tu charges, et le reste suit ou fuit."},
shaco:{n:"Shaco",t:"Le Bouffon démoniaque",c:"#b07cff",d:"Rien de ce que tu fais n'est tout à fait innocent. Tu transformes chaque partie en farce macabre, et tu es le seul à t'en amuser. C'est le plus important."},
sett:{n:"Sett",t:"Le Boss",c:"#f0a850",d:"Tu as grandi dans les fosses de combat et tu n'as pas oublié la règle : celui qui reste debout a raison. Tu encaisses, tu souris, puis tu frappes."},
samira:{n:"Samira",t:"La Rose du désert",c:"#ff6b7a",d:"Le danger est ton terrain de jeu, le style ta monnaie. Tu ne gagnes pas juste un combat : tu veux que tout le monde se souvienne de la manière."},
kaisa:{n:"Kai'Sa",t:"La Fille du Néant",c:"#9a8bff",d:"Tu as survécu là où personne ne survit, et tu t'es adapté. Tu évolues à chaque épreuve, silencieux, jusqu'à ce que tout le monde te prenne enfin au sérieux."},
kayn:{n:"Kayn",t:"Le Moissonneur d'ombre",c:"#e0506e",d:"Deux voix dans ta tête, une lame qui a ses propres idées. Tu navigues entre l'ombre et la rage, et personne, toi compris, ne sait qui va gagner."}
};
const Q=[
{r:"Runeterra",q:"Un portail s'ouvre. Tu atterris à Runeterra, tu choisis où t'installer.",a:[["Les Îles obscures, la brume me va bien",{hecarim:2,shaco:1}],["Noxus, là où la force fait la loi",{samira:2,sett:1}],["Ionia, entre esprit et chaos",{kayn:2,sett:1}],["Le désert de Shurima, loin de la foule",{kaisa:2,samira:1}]]},
{r:"Boutique",q:"Premier passage à la boutique. Ton achat ?",a:[["Des bottes. Arriver vite, c'est tout",{hecarim:2,samira:1}],["Un truc qui sert à rien mais qui fait rire",{shaco:2}],["Un item qui me fait encaisser et rendre les coups",{sett:2,kayn:1}],["Ça dépend de la partie, je m'adapte",{kaisa:2,kayn:1}]]},
{r:"Lore",q:"Un Darkin te propose un pacte : un pouvoir immense, des conséquences floues.",a:[["J'accepte, je gérerai les conséquences plus tard",{kayn:2,sett:1}],["Je refuse. Et je lui fais une blague",{shaco:2}],["Je négocie, j'ai mes propres plans",{kaisa:2,samira:1}],["Je charge d'abord. On discutera après",{hecarim:2,sett:1}]]},
{r:"Ultime",q:"Quel ultime te ressemble le plus ?",a:[["Charger à travers tout le monde",{hecarim:2}],["Disparaître et laisser un clone semer la panique",{shaco:2,kayn:1}],["Une pluie de balles avec le style qui va avec",{samira:2,kaisa:1}],["Fondre sur la cible isolée, l'achever, repartir",{kaisa:1,kayn:2}]]},
{r:"Ce soir",q:"Soirée entre potes. Tu es plutôt…",a:[["Celui qui arrive en premier et met l'ambiance",{hecarim:2,samira:1}],["Celui qui fait une farce à tout le monde",{shaco:2}],["Celui qui tient la porte et gère les bagarres",{sett:2}],["Celui qu'on ne voit pas, puis qui est partout",{kayn:1,kaisa:2}]]},
{r:"Noxus",q:"Tu es convoqué devant le Grand Général. Ta réaction ?",a:[["Je lui montre mon plus beau combo",{samira:2,kaisa:1}],["Je sors un poing et j'attends qu'il dise non",{sett:2,hecarim:1}],["Je souris, j'ai déjà piégé la salle",{shaco:2,kayn:1}],["J'écoute, j'observe, je repars avec ses secrets",{kaisa:2,kayn:1}]]},
{r:"Retard",q:"Tu es en retard à un rendez-vous. Tu arrives comment ?",a:[["Au galop, en bousculant tout",{hecarim:2}],["J'apparais derrière toi, tu n'as rien vu",{shaco:2,kayn:1}],["Avec style, mains dans les poches",{samira:2,sett:1}],["Je change de plan en route, je n'ai pas le choix",{kaisa:2,kayn:1}]]},
{r:"Fin de game",q:"Fin de partie, il te reste 10 PV. Tu fais quoi ?",a:[["Un dernier combo, ça passera",{samira:2,hecarim:1}],["Je laisse une boîte piège et je file",{shaco:2,kaisa:1}],["J'encaisse. Ça fait mon bouclier",{sett:2}],["Je me fonds dans l'ombre et je me soigne",{kayn:2,kaisa:1}]]}
];
const $=id=>document.getElementById(id);
let i=0,s={},busy=false;
function show(id){["intro","quiz","result"].forEach(x=>$(x).hidden=x!==id)}
function ask(){
const o=Q[i];busy=false;$("q").textContent=o.q;$("cnt").textContent="Question "+(i+1)+" sur "+Q.length;$("reg").textContent=o.r;
$("prog").style.width=(i/Q.length*100)+"%";
const box=$("a");box.innerHTML="";
o.a.forEach(([t,p])=>{const b=document.createElement("button");b.className="btn";b.textContent=t;
b.onclick=()=>{if(busy)return;busy=true;b.classList.add("pick");for(const k in p)s[k]=(s[k]||0)+p[k];
setTimeout(()=>{i++;i<Q.length?ask():end()},300)};box.appendChild(b)})}
function end(){
const e=Object.keys(C).map(k=>[k,s[k]||0]).sort((a,b)=>b[1]-a[1]);
const best=e.filter(x=>x[1]===e[0][1]);
const k=best[Math.floor(Math.random()*best.length)][0],c=C[k];
const pic=$("pic");pic.innerHTML="";pic.textContent=c.n[0];
if(IMG[k]){const im=new Image();im.alt=c.n;im.onload=()=>{pic.textContent="";pic.appendChild(im)};im.src=IMG[k]}
$("rn").textContent=c.n;$("rt").textContent=c.t;$("rj").textContent=JOKES[k];$("rd").textContent=c.d;
$("result").style.setProperty("--c",c.c);
const tot=e.reduce((a,x)=>a+x[1],0)||1;
$("aff").innerHTML=e.map(([n,v])=>`<div class="row" style="--c2:${C[n].c}"><span>${C[n].n}</span><b><i style="width:${Math.round(v/e[0][1]*100)}%"></i></b><span>${Math.round(v/tot*100)}%</span></div>`).join("");
show("result")}
function start(){i=0;s={};show("quiz");ask()}
$("start").onclick=start;$("again").onclick=start;
</script>
</body>
</html>
